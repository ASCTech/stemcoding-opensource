# `docker compose up` starts the web stack: rails, vite, sidekiq, postgres, redis.
# Utility/test-only services are behind profiles so they don't collide or clutter:
#   runner   (profile: tools) — one-off commands, e.g. `docker compose run --rm runner ./bin/setup`
#   selenium (profile: test)  — system specs; started explicitly by CI
x-app: &app
  build:
    context: .
    args:
      RUBY_VERSION: '3.4.10'
      NODE_MAJOR: '20'
      BUNDLER_VERSION: '2.7.0'
  image: stemcoding:latest
  stdin_open: true
  tty: true
  volumes:
    - .:/app:cached
    - rails_cache:/app/tmp/cache
    - bundle:/bundle
    - node_modules:/app/node_modules
  environment: &app_env
    NODE_ENV: development
    RAILS_ENV: ${RAILS_ENV:-development}
    REDIS_URL: redis://redis:6379/
    DATABASE_URL: postgres://postgres:postgres@postgres:5432
    BOOTSNAP_CACHE_DIR: /bundle/bootsnap
    VITE_RUBY_HOST: vite
    WEB_CONCURRENCY: 1
    HISTFILE: /app/log/.bash_history
    PSQL_HISTFILE: /app/log/.psql_history
    EDITOR: vi
    CONTAINERIZED: "true"
    DATABASE_HOST: postgres
    DATABASE_USER: postgres
    DATABASE_PASSWORD: ""
  tmpfs:
    - /tmp
  depends_on:
    - postgres
    - redis

services:
  rails:
    <<: *app
    command: bundle exec rails server -b 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - vite

  vite:
    <<: *app
    command: bin/vite dev
    ports:
      - '3036:3036'
    environment:
      <<: *app_env
      VITE_RUBY_HOST: 0.0.0.0

  sidekiq:
    <<: *app
    command: bundle exec sidekiq
    depends_on:
      - postgres
      - redis

  runner:
    <<: *app
    command: /bin/bash
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    ports:
      - 6379

  selenium:
    image: selenium/standalone-chromium
    shm_size: 2gb
    ports:
      - '4444:4444'
    profiles:
      - test

volumes:
  postgres:
  redis:
  bundle:
  node_modules:
  rails_cache:
